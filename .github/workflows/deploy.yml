name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to verify"
        required: true
        default: production
        type: choice
        options:
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# Lecture seule au niveau du workflow : docker-publish se sur-élève localement
# (packages: write), le job production garde le même périmètre.
permissions:
  contents: read

env:
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/santeplus-api
  IMAGE_NAME_WEB: ${{ github.repository_owner }}/santeplus-web

jobs:
  # ──────────────────────────────────────────────
  # Gate: only deploy if CI passed
  # ──────────────────────────────────────────────
  check-ci:
    name: Check CI status
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - run: echo "CI passed — proceeding with deployment"
  # ──────────────────────────────────────────────
  # Build & push Docker images (api + web) to GHCR
  # ──────────────────────────────────────────────
  docker-publish:
    name: Build & Push ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: check-ci
    # Les CI planifiées (sonde hebdo) ne déclenchent ni publication d'images
    # ni déploiement — le push GHCR reste réservé aux intégrations d'un vrai commit.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.event != 'schedule'
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            image: ghcr.io/${{ github.repository_owner }}/santeplus-api
          - name: web
            context: ./apps/web
            image: ghcr.io/${{ github.repository_owner }}/santeplus-web

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Tampon de version lu par GET /api/version (sonde anti-déploiement périmé).
          # Le Dockerfile web ne le consomme pas : avertissement bénin.
          build-args: |
            APP_VERSION=${{ github.sha }}

      - name: Print image tag
        run: |
          echo "Pushed ${{ matrix.name }} -> ${{ steps.meta.outputs.tags }}"

  # ──────────────────────────────────────────────
  # Vérification production (Render auto-deploy)
  # ──────────────────────────────────────────────
  # Historique : le staging d'essai vivait sur Runsite (santeplus.runsite.app,
  # retiré de la plateforme le 2026-10-17 — service suspendu, clé API expirée).
  # La production réelle est l'API Render https://santeplus-api-kp5t.onrender.com,
  # auto-déployée à chaque push master (auto-Deploy). Ce job certifie la
  # production sur le commit qui vient de passer la CI : health 200 puis sonde
  # GET /api/version == SHA (RENDER_GIT_COMMIT au runtime, sinon APP_VERSION /
  # tampon image — cf. apps/api Dockerfile et admin-misc/version).
  # ──────────────────────────────────────────────
  verify-production:
    name: Vérifier production (Render auto-deploy)
    runs-on: ubuntu-latest
    needs: [check-ci, docker-publish]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Guard — variable PRODUCTION_URL définie
        run: |
          if [ -z "${{ vars.PRODUCTION_URL }}" ]; then
            echo "::error::La variable repo PRODUCTION_URL est absente (Settings → Secrets and variables → Actions → Variables)."
            echo "::error::Valeur attendue : URL de base de l'API de production Render (ex. https://<service>.onrender.com)."
            exit 1
          fi

      - name: Health check (Render redémarre ~2 min après le push)
        timeout-minutes: 12
        run: |
          URL="${{ vars.PRODUCTION_URL }}/api/health"
          echo "Checking $URL"
          for i in $(seq 1 60); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$URL" 2>/dev/null || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Production is healthy"
              exit 0
            fi
            echo "Attempt $i/60 — status: $STATUS"
            sleep 10
          done
          echo "❌ Health check failed"
          exit 1

      - name: Vérifier que la production tourne sur le commit déployé
        # Le health 200 ne garantit pas que le déploiement Render s'est fait :
        # si l'instance n'a pas redémarré (auto-Deploy manqué/échoué), l'ancien
        # code reste en service (conception reprise de l'ancienne sonde staging).
        timeout-minutes: 15
        run: |
          SHA="${GITHUB_SHA}"
          LAST=""
          for i in $(seq 1 42); do
            V=$(curl -s --max-time 15 "${{ vars.PRODUCTION_URL }}/api/version" || true)
            LAST="${V:-<injoignable>}"
            echo "Tentative $i/42 : $LAST"
            if echo "$LAST" | grep -q "\"version\":\"${SHA}\""; then
              echo "✅ Production certifiée sur le commit ${SHA}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Après ~7 minutes, la production ne tourne pas sur le commit ${SHA}."
          echo "::error::Dernière réponse de /api/version : ${LAST}"
          echo "::error::→ auto-Deploy Render non terminé ou échoué : vérifier le dashboard Render (dernier deploy du service API), corriger, puis relancer ce workflow."
          exit 1

      - name: Résumé du déploiement
        run: |
          {
            echo "## Production certifiée : ${{ vars.PRODUCTION_URL }}"
            echo ""
            echo "- Commit : \`${GITHUB_SHA}\`"
            echo ""
            echo '```json'
            curl -s --max-time 15 "${{ vars.PRODUCTION_URL }}/api/version"
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────
  # Garde-fous « formules » de la production
  # ──────────────────────────────────────────────
  # Le commit qui vient d'être certifié peut avoir cassé une garde métier sans
  # qu'aucun test ne s'en aperçoive : les suites API tournent sur une base de
  # test, jamais sur le PostgreSQL de Render avec son catalogue réel. C'est
  # exactement ce qui a laissé passer la fuite du forfait familial (formule qui
  # inclut 3 enfants et facture 0 FCFA au-delà), corrigée par la migration
  # 20261027000000. Ce job interroge la production elle-même.
  #
  # Mode : LECTURE SEULE (--read-only). Aucune sonde d'écriture, donc aucune
  # requête POST/PATCH sur la base de production et rien à nettoyer — on lit le
  # catalogue et on vérifie que les champs du forfait sont bien servis.
  #
  # Authentification : connexion automatique, pas de jeton statique. Le script
  # appelle POST /api/auth/login avec les secrets PRODUCTS_CHECK_EMAIL et
  # PRODUCTS_CHECK_PASSWORD (compte de service dédié ci-gardefous@santeplus.bj,
  # SUPER_ADMIN actif — créé par apps/api/scripts/provision-service-account.ts,
  # cf. docs/RUNBOOK-CONTINUITE.md) et fabrique
  # un accessToken à chaque run. On supprime ainsi la cause principale de panne
  # silencieuse : un jeton de 12 h oublié qui transforme la sonde en décor. Le
  # jeton n'est ni exporté ni journalisé, il meurt avec le process.
  #
  # Tant que les deux secrets sont absents, le job se contente d'une ::notice::
  # et sort en succès : une vérification qui n'a pas les moyens de tourner ne
  # doit pas bloquer une mise en production. Dès qu'ils sont renseignés, elle
  # devient bloquante (code de sortie du script respecté).
  # ──────────────────────────────────────────────
  verify-guardrails:
    name: Vérifier les garde-fous produits (lecture seule)
    runs-on: ubuntu-latest
    needs: [verify-production]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Aucune dépendance à installer : le script n'utilise que fetch natif.
      - name: Garde-fous du forfait — sonde en lecture seule
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          PRODUCTS_CHECK_EMAIL: ${{ secrets.PRODUCTS_CHECK_EMAIL }}
          PRODUCTS_CHECK_PASSWORD: ${{ secrets.PRODUCTS_CHECK_PASSWORD }}
        run: |
          set -euo pipefail
          # `${VAR:-}` et non `${VAR}` : sous `set -u`, un secret totalement
          # absent laisserait la variable non définie et ferait échouer le job —
          # exactement le contraire du comportement voulu (non bloquant).
          if [ -z "${PRODUCTS_CHECK_EMAIL:-}" ] || [ -z "${PRODUCTS_CHECK_PASSWORD:-}" ]; then
            echo "::notice::Secrets PRODUCTS_CHECK_EMAIL / PRODUCTS_CHECK_PASSWORD absents — sonde des garde-fous ignorée (lecture seule, non bloquante tant que les identifiants ne sont pas configurés)."
            {
              echo "## Garde-fous produits : non vérifiés"
              echo ""
              echo "Secrets \`PRODUCTS_CHECK_EMAIL\` / \`PRODUCTS_CHECK_PASSWORD\` absents — job volontairement non bloquant."
              echo "Pour activer la vérification : créer le compte de service puis renseigner les secrets."
              echo "  1. cd apps/api && DATABASE_URL=\"…\" npx tsx scripts/provision-service-account.ts"
              echo "  2. Settings → Secrets and variables → Actions → Secrets : \`PRODUCTS_CHECK_EMAIL\` et \`PRODUCTS_CHECK_PASSWORD\`"
              echo "Compte : \`ci-gardefous@santeplus.bj\`, SUPER_ADMIN actif (droit \`products.manage\`). Voir docs/RUNBOOK-CONTINUITE.md."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "${PRODUCTION_URL}" ]; then
            echo "::error::Variable repo PRODUCTION_URL absente — impossible de cibler la production."
            exit 1
          fi
          echo "Sonde lecture seule sur ${PRODUCTION_URL}"
          # Le script écrit son rapport sur la sortie standard : on le duplique
          # dans le résumé du run pour qu'un échec soit lisible sans ouvrir les logs.
          set +e
          # Le script se connecte lui-même (POST /api/auth/login) : le mot de
          # passe ne sort pas de l'environnement du process, le jeton obtenu
          # n'est jamais affiché. Il n'y a donc pas de pré-étape « obtenir un
          # jeton » à coder ici.
          node scripts-dev/verify-products-prod.mjs \
            --email "${PRODUCTS_CHECK_EMAIL:-}" \
            --password "${PRODUCTS_CHECK_PASSWORD:-}" \
            --api "${PRODUCTION_URL}" \
            --read-only | tee rapport-garde-fous.txt
          STATUT=${PIPESTATUS[0]}
          set -e
          {
            echo "## Garde-fous produits — ${PRODUCTION_URL}"
            echo ""
            echo '```'
            cat rapport-garde-fous.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${STATUT}" != "0" ]; then
            # 1 = garde-fou ou champ manquant (vraie régression métier) ;
            # 2 = connexion refusée / API injoignable (rien à conclure sur les gardes).
            if [ "${STATUT}" = "2" ]; then
              echo "::error::Sonde impossible (code 2) : connexion refusée ou API injoignable. Vérifier PRODUCTS_CHECK_EMAIL / PRODUCTS_CHECK_PASSWORD (compte SUPER_ADMIN actif, mot de passe à jour) avant de conclure à une régression."
            else
              echo "::error::La sonde des garde-fous a échoué (code ${STATUT}). Une formule de production n'est plus conforme — voir le rapport ci-dessus."
            fi
            exit "${STATUT}"
          fi

  # ──────────────────────────────────────────────
  # Déploiement du front sur Cloudflare Pages
  # ──────────────────────────────────────────────
  # Historique : le front Pages était déployé à la main (script local
  # .freebuff/deploy-cf-pages.mjs, non versionné) et le build en ligne a
  # pris plusieurs jours de retard sur Git — le fix a11y e17aa16 est arrivé
  # en prod front 6 jours après sa fusion. Ce job aligne santeplus.pages.dev
  # sur le commit qui vient de passer la CI, à chaque push master.
  #
  # Auth : secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID (variable).
  #       Le jeton wrangler page est un OAuth à durée courte : à renouveler
  #       via `wrangler login` en local puis re-pousser le secret, ou mieux,
  #       remplacer par un API token permanent (Pages Edit).
  # ──────────────────────────────────────────────
  deploy-pages:
    name: Déployer front sur Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [check-ci, docker-publish]
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'schedule')
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Guard — secrets Cloudflare présents
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ vars.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::Secrets Cloudflare manquants (CLOUDFLARE_API_TOKEN secret, CLOUDFLARE_ACCOUNT_ID variable) — front Pages non déployé."
            exit 1
          fi

      - name: Build du front (VITE_API_URL figé sur la prod Render)
        run: |
          npm ci
          npm run build -w apps/web
        env:
          VITE_API_URL: ${{ vars.PRODUCTION_URL }}

      - name: En-têtes Pages (immuable assets, sw.js revalidable)
        # Réplique exacte de la section _headers écrite par le script local :
        # /assets/* versionné par hash → cache immuable ; /sw.js doit rester
        # revalidable sinon un vieux service worker sert un front périmé.
        run: |
          cat > apps/web/dist/_headers <<'EOF'
          /assets/*
            Cache-Control: public, max-age=31536000, immutable

          /sw.js
            Cache-Control: public, max-age=0, must-revalidate
            Service-Worker-Allowed: /

          /manifest.webmanifest
            Cache-Control: public, max-age=86400

          /*
            X-Content-Type-Options: nosniff
            X-Frame-Options: DENY
            Referrer-Policy: strict-origin-when-cross-origin
          EOF

      - name: Déploiement Cloudflare Pages (branche master = prod)
        run: >-
          npx --yes wrangler@latest pages deploy apps/web/dist
          --project-name santeplus
          --branch master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Certification — le front sert bien le nouveau bundle
        timeout-minutes: 8
        run: |
          sleep 20
          # L'index référence un bundle JS hashé : il doit différer de la
          # version précédente si du code a changé. On compare plutôt un
          # marqueur stable : le HTML servi doit contenir le titre et un asset
          # fraîchement déployé doit répondre 200.
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://santeplus.pages.dev/" || true)
            if [ "$CODE" = "200" ]; then
              echo "✅ Front Cloudflare Pages en ligne (HTTP 200)"
              exit 0
            fi
            echo "Tentative $i/12 — status: $CODE"
            sleep 10
          done
          echo "::error::Front santeplus.pages.dev ne répond pas 200 après déploiement wrangler."
          exit 1

  # ──────────────────────────────────────────────
  # Déploiement du front sur Vercel
  # ──────────────────────────────────────────────
  # Historique : Vercel était publié à la main (`npx vercel --prod`) et ne
  # suivait donc pas Git — santeplus-sigma.vercel.app est resté deux jours en
  # retard alors que Pages était à jour. Ce job aligne l'alias Vercel sur le
  # commit qui vient de passer la CI, comme deploy-pages le fait pour
  # Cloudflare.
  #
  # Auth : secret VERCEL_TOKEN + variables VERCEL_ORG_ID / VERCEL_PROJECT_ID.
  #       Les deux identifiants ne sont pas des secrets (ils figurent dans
  #       apps/web/.vercel/project.json, non versionné) : ils vont en variables
  #       de dépôt, comme CLOUDFLARE_ACCOUNT_ID.
  # ──────────────────────────────────────────────
  deploy-vercel:
    name: Déployer front sur Vercel
    runs-on: ubuntu-latest
    needs: [check-ci, docker-publish]
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'schedule')
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_ALIAS: https://santeplus-sigma.vercel.app
    steps:
      - uses: actions/checkout@v5

      # Tant que le jeton n'est pas en place, le job avertit et s'arrête sans
      # rendre Deploy rouge : un push qui ne touche pas au front ne doit pas
      # échouer parce qu'une intégration n'est pas encore configurée. Le
      # résumé du run, lui, reste explicite sur le fait que l'alias n'a pas
      # été mis à jour — c'est ce qui évite de recreuser l'écart de deux jours.
      - name: Guard — configuration Vercel présente
        id: guard
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          MISSING=""
          if [ -z "${VERCEL_TOKEN}" ]; then MISSING="VERCEL_TOKEN (secret)"; fi
          if [ -z "${VERCEL_ORG_ID:-}" ]; then MISSING="${MISSING:+${MISSING}, }VERCEL_ORG_ID (variable)"; fi
          if [ -z "${VERCEL_PROJECT_ID:-}" ]; then MISSING="${MISSING:+${MISSING}, }VERCEL_PROJECT_ID (variable)"; fi
          if [ -n "${MISSING}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Configuration Vercel incomplète (${MISSING}) — déploiement ignoré pour ce run, l'alias santeplus-sigma.vercel.app reste sur sa dernière version."
            {
              echo "## Front Vercel : non déployé"
              echo ""
              echo "Configuration manquante : ${MISSING}."
              echo "Le job est volontairement non bloquant tant que l'intégration n'est pas branchée."
              echo "Pour activer le déploiement automatique :"
              echo "  1. Vercel → Account Settings → Tokens → Create"
              echo '  2. `gh secret set VERCEL_TOKEN`'
              echo '  3. Variables : `VERCEL_ORG_ID` et `VERCEL_PROJECT_ID` (voir apps/web/.vercel/project.json)'
              echo ""
              echo "L'alias Vercel sert donc encore la dernière version publiée à la main."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # Version majeure figée : le CLI est appelé plusieurs fois (déploiement
      # puis boucle de certification) et un `npx vercel@latest` à chaque appel
      # retéléchargerait le paquet à chaque itération.
      - name: CLI Vercel
        if: steps.guard.outputs.ready == 'true'
        run: npm install --global vercel@50

      - name: Déploiement Vercel (production, build distant)
        if: steps.guard.outputs.ready == 'true'
        id: deploy
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          # --format=json : l'identifiant du déploiement est indispensable à
          # l'étape de certification, et le lire dans un JSON vaut mieux que
          # découper la sortie humaine du CLI.
          vercel deploy --prod --yes --format=json \
            --token="${VERCEL_TOKEN}" > "${RUNNER_TEMP}/vercel-deploy.json"
          # Le JSON est parfois précédé des lignes de progression du CLI :
          # l'extracteur repère la première accolade avant de parser.
          cat > "${RUNNER_TEMP}/vercel-field.mjs" <<'EOF'
          import fs from 'node:fs';
          const [file, field] = process.argv.slice(2);
          const raw = fs.readFileSync(file, 'utf8');
          const start = raw.indexOf('{');
          if (start < 0) {
            console.error(`Pas de JSON dans ${file}`);
            process.exit(1);
          }
          const json = JSON.parse(raw.slice(start));
          const read = (path) =>
            path.split('.').reduce((acc, key) => (acc == null ? acc : acc[key]), json);
          // `field` accepte plusieurs chemins séparés par des virgules : le
          // premier présent gagne (le CLI range l'URL tantôt à la racine,
          // tantôt sous `deployment`, selon la version).
          let value;
          for (const candidate of field.split(',')) {
            const found = read(candidate.trim());
            if (found != null && found !== '') {
              value = found;
              break;
            }
          }
          if (value == null || value === '') {
            console.error(`Champ ${field} absent de ${file}`);
            process.exit(1);
          }
          console.log(typeof value === 'string' ? value.replace(/^https?:\/\//, '') : value);
          EOF
          # Selon la version du CLI, le JSON expose `id` et/ou `url` : on
          # garde les deux et la certification accepte l'un ou l'autre.
          ID=$(node "${RUNNER_TEMP}/vercel-field.mjs" "${RUNNER_TEMP}/vercel-deploy.json" id,deployment.id || true)
          URL=$(node "${RUNNER_TEMP}/vercel-field.mjs" "${RUNNER_TEMP}/vercel-deploy.json" url,deployment.url || true)
          if [ -z "${ID}" ] && [ -z "${URL}" ]; then
            # Le déploiement a réussi : ne pas transformer un changement de
            # format de sortie du CLI en échec de pipeline. La certification
            # se rabattra sur la disponibilité de l'alias, en le signalant.
            echo "::warning::Identifiant du déploiement Vercel introuvable dans la sortie du CLI — certification réduite à la disponibilité de l'alias."
          fi
          echo "id=${ID}" >> "$GITHUB_OUTPUT"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Déploiement créé : ${ID:-?} ${URL:-}"

      - name: Certification — l'alias Vercel pointe sur le déploiement créé
        if: steps.guard.outputs.ready == 'true'
        timeout-minutes: 8
        env:
          DEPLOY_ID: ${{ steps.deploy.outputs.id }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          # L'URL unique d'un déploiement est derrière Vercel Authentication
          # (302) : on interroge le CLI, authentifié, sur l'alias public. Si le
          # déploiement auquel l'alias répond est celui qu'on vient de créer,
          # c'est bien le nouveau bundle qui est servi, pas une version
          # antérieure restée collée au domaine.
          REF="${DEPLOY_ID:-${DEPLOY_URL}}"
          for i in $(seq 1 18); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
              "${VERCEL_ALIAS}/?cb=${RANDOM}" || true)
            if [ -z "${REF}" ]; then
              if [ "${CODE}" = "200" ]; then
                echo "⚠️  ${VERCEL_ALIAS} répond 200, mais l'identifiant du déploiement est inconnu : version servie non certifiée."
                exit 0
              fi
            else
              vercel inspect "${VERCEL_ALIAS}" --format=json \
                --token="${VERCEL_TOKEN}" > "${RUNNER_TEMP}/vercel-inspect.json" 2>/dev/null || true
              CUR_ID=$(node "${RUNNER_TEMP}/vercel-field.mjs" "${RUNNER_TEMP}/vercel-inspect.json" id || true)
              CUR_URL=$(node "${RUNNER_TEMP}/vercel-field.mjs" "${RUNNER_TEMP}/vercel-inspect.json" url || true)
              SAME=0
              if [ -n "${DEPLOY_ID}" ] && [ "${CUR_ID}" = "${DEPLOY_ID}" ]; then SAME=1; fi
              if [ -n "${DEPLOY_URL}" ] && [ "${CUR_URL}" = "${DEPLOY_URL}" ]; then SAME=1; fi
              if [ "${SAME}" = "1" ] && [ "${CODE}" = "200" ]; then
                echo "✅ ${VERCEL_ALIAS} sert le déploiement ${REF} (HTTP 200)"
                exit 0
              fi
              echo "Tentative ${i}/18 — alias → ${CUR_ID:-?} (${CUR_URL:-?}), attendu ${REF}, HTTP ${CODE}"
            fi
            sleep 10
          done
          # Deux cas très différents se ressemblent ici :
          #  - identité illisible (sortie du CLI inattendue) alors que l'alias
          #    répond 200 → lecture de confort, on signale sans bloquer ;
          #  - identité lisible mais différente de celle créée → l'alias sert
          #    réellement une autre version, c'est la panne que ce job traque.
          if [ -z "${CUR_ID:-}${CUR_URL:-}" ] && [ "${CODE}" = "200" ]; then
            echo "::warning::${VERCEL_ALIAS} répond 200 mais le déploiement servi n'a pas pu être identifié — certification partielle."
            exit 0
          fi
          echo "::error::${VERCEL_ALIAS} ne sert pas le déploiement ${REF} après 3 min (dernier vu : ${CUR_ID:-aucun} / ${CUR_URL:-aucun}, HTTP ${CODE:-aucun})."
          exit 1
