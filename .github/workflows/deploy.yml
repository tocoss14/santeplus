name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/santeplus-api

jobs:
  # ──────────────────────────────────────────────
  # Gate: only deploy if CI passed
  # ──────────────────────────────────────────────
  check-ci:
    name: Check CI status
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - run: echo "CI passed — proceeding with deployment"

  # ──────────────────────────────────────────────
  # Build & push Docker image to GHCR
  # ──────────────────────────────────────────────
  docker-publish:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: check-ci
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # Deploy to staging (automatic on main)
  # ──────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-publish
    if: >-
      github.event_name == 'workflow_dispatch'
        ? github.event.inputs.environment == 'staging'
        : github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Clever Cloud
        if: vars.DEPLOY_TARGET == 'clevercloud'
        env:
          CC_API_TOKEN: ${{ secrets.CC_API_TOKEN }}
          CC_API_SECRET: ${{ secrets.CC_API_SECRET }}
        run: |
          npm install -g clever-tools
          clever deploy --alias ${{ vars.CC_APP_ALIAS }} --force

      - name: Deploy to Runsite
        if: vars.DEPLOY_TARGET == 'runsite'
        env:
          RUNSITE_API_KEY: ${{ secrets.RUNSITE_API_KEY }}
          RUNSITE_SERVICE_ID: ${{ secrets.RUNSITE_SERVICE_ID }}
        run: |
          echo "Triggering Runsite deployment..."
          curl -s -X POST \
            "https://api.runsite.app/v1/services/${{ secrets.RUNSITE_SERVICE_ID }}/deploy" \
            -H "Authorization: Bearer $RUNSITE_API_KEY" \
            -H "Content-Type: application/json"

      - name: Deploy via SSH
        if: vars.DEPLOY_TARGET == 'ssh'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ vars.DEPLOY_PATH || '/opt/santeplus' }}
            git pull origin main
            docker compose pull
            docker compose up -d --build
            docker compose exec -T api npx prisma migrate deploy
            docker image prune -f

      - name: Health check
        run: |
          URL="${{ vars.STAGING_URL }}/api/health"
          echo "Checking $URL"
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" 2>/dev/null || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Staging is healthy"
              exit 0
            fi
            echo "Attempt $i/20 — status: $STATUS"
            sleep 10
          done
          echo "❌ Health check failed"
          exit 1

      - name: Run migrations on staging
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'seed.yml',
              ref: context.ref,
              inputs: { environment: 'staging', action: 'migrate' }
            });
            console.log('Triggered seed.yml (migrate) for staging');

  # ──────────────────────────────────────────────
  # Deploy to production (manual trigger only)
  # ──────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-publish
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Clever Cloud
        if: vars.DEPLOY_TARGET == 'clevercloud'
        env:
          CC_API_TOKEN: ${{ secrets.CC_API_TOKEN }}
          CC_API_SECRET: ${{ secrets.CC_API_SECRET }}
        run: |
          npm install -g clever-tools
          clever deploy --alias ${{ vars.CC_APP_ALIAS }} --force

      - name: Deploy via SSH
        if: vars.DEPLOY_TARGET == 'ssh'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ vars.DEPLOY_PATH || '/opt/santeplus' }}
            git pull origin main
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml exec -T api npx prisma migrate deploy
            docker image prune -f

      - name: Health check
        run: |
          URL="${{ vars.PRODUCTION_URL }}/api/health"
          echo "Checking $URL"
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" 2>/dev/null || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Production is healthy"
              exit 0
            fi
            echo "Attempt $i/20 — status: $STATUS"
            sleep 10
          done
          echo "❌ Health check failed"
          exit 1
