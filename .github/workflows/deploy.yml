name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to verify"
        required: true
        default: production
        type: choice
        options:
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# Lecture seule au niveau du workflow : docker-publish se sur-élève localement
# (packages: write), le job production garde le même périmètre.
permissions:
  contents: read

env:
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/santeplus-api
  IMAGE_NAME_WEB: ${{ github.repository_owner }}/santeplus-web

jobs:
  # ──────────────────────────────────────────────
  # Gate: only deploy if CI passed
  # ──────────────────────────────────────────────
  check-ci:
    name: Check CI status
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - run: echo "CI passed — proceeding with deployment"
  # ──────────────────────────────────────────────
  # Build & push Docker images (api + web) to GHCR
  # ──────────────────────────────────────────────
  docker-publish:
    name: Build & Push ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: check-ci
    # Les CI planifiées (sonde hebdo) ne déclenchent ni publication d'images
    # ni déploiement — le push GHCR reste réservé aux intégrations d'un vrai commit.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.event != 'schedule'
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            image: ghcr.io/${{ github.repository_owner }}/santeplus-api
          - name: web
            context: ./apps/web
            image: ghcr.io/${{ github.repository_owner }}/santeplus-web

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Tampon de version lu par GET /api/version (sonde anti-déploiement périmé).
          # Le Dockerfile web ne le consomme pas : avertissement bénin.
          build-args: |
            APP_VERSION=${{ github.sha }}

      - name: Print image tag
        run: |
          echo "Pushed ${{ matrix.name }} -> ${{ steps.meta.outputs.tags }}"

  # ──────────────────────────────────────────────
  # Vérification production (Render auto-deploy)
  # ──────────────────────────────────────────────
  # Historique : le staging d'essai vivait sur Runsite (santeplus.runsite.app,
  # retiré de la plateforme le 2026-10-17 — service suspendu, clé API expirée).
  # La production réelle est l'API Render https://santeplus-api-kp5t.onrender.com,
  # auto-déployée à chaque push master (auto-Deploy). Ce job certifie la
  # production sur le commit qui vient de passer la CI : health 200 puis sonde
  # GET /api/version == SHA (APP_VERSION tamponné, sinon RENDER_GIT_COMMIT —
  # cf. apps/api Dockerfile et admin-misc/version).
  # ──────────────────────────────────────────────
  verify-production:
    name: Vérifier production (Render auto-deploy)
    runs-on: ubuntu-latest
    needs: [check-ci, docker-publish]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Guard — variable PRODUCTION_URL définie
        run: |
          if [ -z "${{ vars.PRODUCTION_URL }}" ]; then
            echo "::error::La variable repo PRODUCTION_URL est absente (Settings → Secrets and variables → Actions → Variables)."
            echo "::error::Valeur attendue : URL de base de l'API de production Render (ex. https://<service>.onrender.com)."
            exit 1
          fi

      - name: Health check (Render redémarre ~2 min après le push)
        timeout-minutes: 12
        run: |
          URL="${{ vars.PRODUCTION_URL }}/api/health"
          echo "Checking $URL"
          for i in $(seq 1 60); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$URL" 2>/dev/null || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Production is healthy"
              exit 0
            fi
            echo "Attempt $i/60 — status: $STATUS"
            sleep 10
          done
          echo "❌ Health check failed"
          exit 1

      - name: Vérifier que la production tourne sur le commit déployé
        # Le health 200 ne garantit pas que le déploiement Render s'est fait :
        # si l'instance n'a pas redémarré (auto-Deploy manqué/échoué), l'ancien
        # code reste en service (conception reprise de l'ancienne sonde staging).
        timeout-minutes: 15
        run: |
          SHA="${GITHUB_SHA}"
          LAST=""
          for i in $(seq 1 42); do
            V=$(curl -s --max-time 15 "${{ vars.PRODUCTION_URL }}/api/version" || true)
            LAST="${V:-<injoignable>}"
            echo "Tentative $i/42 : $LAST"
            if echo "$LAST" | grep -q "\"version\":\"${SHA}\""; then
              echo "✅ Production certifiée sur le commit ${SHA}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Après ~7 minutes, la production ne tourne pas sur le commit ${SHA}."
          echo "::error::Dernière réponse de /api/version : ${LAST}"
          echo "::error::→ auto-Deploy Render non terminé ou échoué : vérifier le dashboard Render (dernier deploy du service API), corriger, puis relancer ce workflow."
          exit 1

      - name: Résumé du déploiement
        run: |
          {
            echo "## Production certifiée : ${{ vars.PRODUCTION_URL }}"
            echo ""
            echo "- Commit : \`${GITHUB_SHA}\`"
            echo ""
            echo '```json'
            curl -s --max-time 15 "${{ vars.PRODUCTION_URL }}/api/version"
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
