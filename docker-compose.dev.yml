version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit_dev
      POSTGRES_DB: santeplus_audit
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata_dev:
