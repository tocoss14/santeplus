# ─────────────────────────────────────────────────────────────────────────────
# Frontend nginx — sert le SPA et proxifie /api/ vers le service API.
#
# Monté en TEMPLATE (/etc/nginx/templates/default.conf.template) : ${API_UPSTREAM}
# est substitué par envsubst au démarrage du conteneur (mécanisme officiel de
# l'image nginx ; les variables runtime nginx $host, $request_uri... ne sont
# PAS touchées). Valeur par défaut définie par ENV dans le Dockerfile.
#
#   - docker compose : API_UPSTREAM=http://api:4000   (nom du service)
#   - Runsite / PaaS : API_UPSTREAM=http://<nom-interne-API>:4000
#     (URL interne du réseau privé — pas l'URL publique https)
#
# ⚠️ Sans slash final : proxy_pass sans URI conserve le chemin d'origine
#    (/api/health → /api/health sur l'API).
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Upstream injoignable → JSON explicite (jamais le fallback SPA)
    error_page 502 503 504 = @api_unreachable;

    # ── API : ne doit JAMAIS tomber dans le catch-all SPA ──────────────────
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Si l'upstream est en https (URL publique), activer le SNI
        proxy_ssl_server_name on;

        client_max_body_size 20m;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    # ── Health check : sonde de bout en bout (proxifie /api/health) ────────
    location = /health {
        access_log off;
        proxy_pass ${API_UPSTREAM}/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # ── SPA : tout le reste sert index.html ────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Upstream API injoignable → 502 JSON ────────────────────────────────
    location @api_unreachable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 502 '{"statusCode":502,"message":"API indisponible — upstream ${API_UPSTREAM} injoignable"}';
    }
}
