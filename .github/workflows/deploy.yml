name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/santeplus-api
  IMAGE_NAME_WEB: ${{ github.repository_owner }}/santeplus-web

jobs:
  # ──────────────────────────────────────────────
  # Gate: only deploy if CI passed
  # ──────────────────────────────────────────────
  check-ci:
    name: Check CI status
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - run: echo "CI passed — proceeding with deployment"

  # ──────────────────────────────────────────────
  # Build & push Docker images (api + web) to GHCR
  # ──────────────────────────────────────────────
  docker-publish:
    name: Build & Push ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: check-ci
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          - name: web
            context: ./apps/web
            image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image tag
        run: |
          echo "Pushed ${{ matrix.name }} -> ${{ steps.meta.outputs.tags }}"

  # ──────────────────────────────────────────────
  # Deploy to staging (automatic on main)
  # ──────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-publish
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging') ||
      (github.event_name == 'workflow_run' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - uses: actions/checkout@v5

      - name: Deploy to Clever Cloud
        if: vars.DEPLOY_TARGET == 'clevercloud'
        env:
          CC_API_TOKEN: ${{ secrets.CC_API_TOKEN }}
          CC_API_SECRET: ${{ secrets.CC_API_SECRET }}
        run: |
          npm install -g clever-tools
          clever deploy --alias ${{ vars.CC_APP_ALIAS }} --force

      - name: Deploy to Runsite
        if: vars.DEPLOY_TARGET == 'runsite'
        env:
          RUNSITE_API_KEY: ${{ secrets.RUNSITE_API_KEY }}
          RUNSITE_SERVICE_ID: ${{ secrets.RUNSITE_SERVICE_ID }}
        run: |
          echo "Triggering Runsite deployment..."
          curl -s -X POST \
            "https://api.runsite.app/v1/services/${{ secrets.RUNSITE_SERVICE_ID }}/deploy" \
            -H "Authorization: Bearer $RUNSITE_API_KEY" \
            -H "Content-Type: application/json"

      - name: Deploy via SSH
        if: vars.DEPLOY_TARGET == 'ssh'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG,DOMAIN,LETSENCRYPT_EMAIL,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd ${{ vars.DEPLOY_PATH || '/opt/santeplus' }}
            COMPOSE="docker compose -f docker-compose.prod.yml --env-file .env.prod"

            [ -f .env.prod ] || { echo "ERROR: .env.prod missing on server — create it from .env.prod.example"; exit 1; }

            # Optional: authenticate to GHCR for private packages
            if [ -n "$GHCR_TOKEN" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi

            git pull origin main

            # First deploy: issue the initial TLS certificate before starting the stack
            if [ ! -f "/etc/letsencrypt/live/$DOMAIN/fullchain.pem" ]; then
              echo "==> Issuing first Let's Encrypt certificate for $DOMAIN"
              $COMPOSE run --rm --entrypoint certbot -p 80:80 certbot \
                certonly --standalone -d "$DOMAIN" \
                --email "$LETSENCRYPT_EMAIL" --agree-tos --no-eff-email
            fi

            # Pull pinned GHCR images (no build on the server)
            $COMPOSE pull api web
            $COMPOSE up -d
            $COMPOSE exec -T api npx prisma migrate deploy
            docker image prune -f
        env:
          IMAGE_TAG: ${{ github.sha }}
          DOMAIN: ${{ vars.LETSENCRYPT_DOMAIN || 'santeplus.bj' }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL || 'admin@santeplus.bj' }}

      - name: Health check
        run: |
          URL="${{ vars.STAGING_URL }}/api/health"
          echo "Checking $URL"
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" 2>/dev/null || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Staging is healthy"
              exit 0
            fi
            echo "Attempt $i/20 — status: $STATUS"
            sleep 10
          done
          echo "❌ Health check failed"
          exit 1

      - name: Run migrations on staging
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'seed.yml',
              ref: context.ref,
              inputs: { environment: 'staging', action: 'migrate' }
            });
            console.log('Triggered seed.yml (migrate) for staging');

  # ──────────────────────────────────────────────
  # Deploy to production (manual trigger only)
  # ──────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-publish
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - uses: actions/checkout@v5

      - name: Deploy to Clever Cloud
        if: vars.DEPLOY_TARGET == 'clevercloud'
        env:
          CC_API_TOKEN: ${{ secrets.CC_API_TOKEN }}
          CC_API_SECRET: ${{ secrets.CC_API_SECRET }}
        run: |
          npm install -g clever-tools
          clever deploy --alias ${{ vars.CC_APP_ALIAS }} --force

      - name: Deploy via SSH
        if: vars.DEPLOY_TARGET == 'ssh'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG,DOMAIN,LETSENCRYPT_EMAIL,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd ${{ vars.DEPLOY_PATH || '/opt/santeplus' }}
            COMPOSE="docker compose -f docker-compose.prod.yml --env-file .env.prod"

            [ -f .env.prod ] || { echo "ERROR: .env.prod missing on server — create it from .env.prod.example"; exit 1; }

            # Optional: authenticate to GHCR for private packages
            if [ -n "$GHCR_TOKEN" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi

            git pull origin main

            # First deploy: issue the initial TLS certificate before starting the stack
            if [ ! -f "/etc/letsencrypt/live/$DOMAIN/fullchain.pem" ]; then
              echo "==> Issuing first Let's Encrypt certificate for $DOMAIN"
              $COMPOSE run --rm --entrypoint certbot -p 80:80 certbot \
                certonly --standalone -d "$DOMAIN" \
                --email "$LETSENCRYPT_EMAIL" --agree-tos --no-eff-email
            fi

            # Pull pinned GHCR images (no build on the server)
            $COMPOSE pull api web
            $COMPOSE up -d
            $COMPOSE exec -T api npx prisma migrate deploy
            docker image prune -f
        env:
          IMAGE_TAG: ${{ github.sha }}
          DOMAIN: ${{ vars.LETSENCRYPT_DOMAIN || 'santeplus.bj' }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL || 'admin@santeplus.bj' }}

      - name: Health check
        run: |
          URL="${{ vars.PRODUCTION_URL }}/api/health"
          echo "Checking $URL"
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" 2>/dev/null || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Production is healthy"
              exit 0
            fi
            echo "Attempt $i/20 — status: $STATUS"
            sleep 10
          done
          echo "❌ Health check failed"
          exit 1
