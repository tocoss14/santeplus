# ══════════════════════════════════════════════════════════════════════════════
# SantéPlus Bénin — Production Stack
# ══════════════════════════════════════════════════════════════════════════════
#
# Usage:
#   cp .env.prod.example .env.prod    # Fill in secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# First deploy (with empty DB):
#   docker compose -f docker-compose.prod.yml --env-file .env.prod exec api \
#     npx prisma migrate deploy && npx tsx prisma/seed.ts
#
# Subsequent deploys:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod pull
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# ══════════════════════════════════════════════════════════════════════════════

services:
  # ── Reverse proxy (TLS termination + rate limiting) ──────────────────────
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── API (NestJS) ────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-santeplus}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-santeplus}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.prod}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?Set FIELD_ENCRYPTION_KEY in .env.prod}
      PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN (e.g. https://app.santeplus.bj)}
      APP_URL: ${APP_URL:?Set APP_URL (e.g. https://app.santeplus.bj)}
      NODE_ENV: production
      MOCK_PAYMENTS: "false"
      PAY_PROVIDERS: ${PAY_PROVIDERS:-FEDAPAY,CINETPAY}
      FEDAPAY_SECRET_KEY: ${FEDAPAY_SECRET_KEY:-}
      FEDAPAY_MODE: ${FEDAPAY_MODE:-sandbox}
      CINETPAY_API_KEY: ${CINETPAY_API_KEY:-}
      CINETPAY_SITE_ID: ${CINETPAY_SITE_ID:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      EMAIL_API_URL: ${EMAIL_API_URL:-}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@santeplus.bj}
      SMS_API_URL: ${SMS_API_URL:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_SENDER: ${SMS_SENDER:-SantePlus}
      WA_TOKEN: ${WA_TOKEN:-}
      WA_PHONE_ID: ${WA_PHONE_ID:-}
      NOTIFY_EMAIL_TOPICS: ${NOTIFY_EMAIL_TOPICS:-}
      NOTIFY_SMS_TOPICS: ${NOTIFY_SMS_TOPICS:-}
    volumes:
      - uploads:/app/uploads
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"

  # ── Web (React SPA via nginx) ───────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── PostgreSQL (managed in production — kept here for self-hosted) ──────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-santeplus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-santeplus}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - backend
    # NO ports exposed — accessible only from within the backend network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-santeplus}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  # ── Certbot (Let's Encrypt auto-renewal) ────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    # Auto-renewal: runs every 12 hours
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 43200 & wait $${!}; done;'"
    networks:
      - frontend

# ══════════════════════════════════════════════════════════════════════════════
volumes:
  pgdata:
    driver: local
  uploads:
    driver: local
  certbot-webroot:
    driver: local
  certbot-certs:
    driver: local

# ══════════════════════════════════════════════════════════════════════════════
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true   # No external access — API↔DB only
