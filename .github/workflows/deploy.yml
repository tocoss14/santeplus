name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# Lecture seule au niveau du workflow : docker-publish se sur-élève localement
# (packages: write), le job staging garde actions: write pour dispatcher seed.yml.
permissions:
  contents: read

env:
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/santeplus-api
  IMAGE_NAME_WEB: ${{ github.repository_owner }}/santeplus-web

jobs:
  # ──────────────────────────────────────────────
  # Gate: only deploy if CI passed
  # ──────────────────────────────────────────────
  check-ci:
    name: Check CI status
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - run: echo "CI passed — proceeding with deployment"# ──────────────────────────────────────────────
# Build & push Docker images (api + web) to GHCR
# ──────────────────────────────────────────────
  docker-publish:
    name: Build & Push ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: check-ci
    # Les CI planifiées (sonde hebdo) ne déclenchent ni publication d'images
    # ni déploiement — le push GHCR reste réservé aux intégrations d'un vrai commit.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.event != 'schedule'
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            image: ghcr.io/${{ github.repository_owner }}/santeplus-api
          - name: web
            context: ./apps/web
            image: ghcr.io/${{ github.repository_owner }}/santeplus-web

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image tag
        run: |
          echo "Pushed ${{ matrix.name }} -> ${{ steps.meta.outputs.tags }}"

  # ──────────────────────────────────────────────
  # Deploy to staging (automatic on main)
  # ──────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-publish
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging') ||
      (github.event_name == 'workflow_run' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    permissions:
      contents: read
      actions: write
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - uses: actions/checkout@v5

      - name: Deploy to Runsite
        if: vars.DEPLOY_TARGET == 'runsite'
        env:
          RUNSITE_API_KEY: ${{ secrets.RUNSITE_API_KEY }}
          RUNSITE_SERVICE_ID: ${{ secrets.RUNSITE_SERVICE_ID }}
        run: |
          echo "Triggering Runsite deployment..."
          # --fail : un endpoint/clé invalide doit faire échouer le job (pas de 404 silencieux).
          # L'API publique actuelle exige /api/v1/.../deployments pour construire et
          # publier un nouveau commit ; /deploy ne fait que démarrer l'image existante.
          curl --fail-with-body -s -X POST \
            "https://api.runsite.app/api/v1/web-services/${{ secrets.RUNSITE_SERVICE_ID }}/deployments" \
            -H "Authorization: Bearer $RUNSITE_API_KEY" \
            -H "Content-Type: application/json" \
            --data '{"branch":"master"}'

      - name: Health check
        run: |
          URL="${{ vars.STAGING_URL }}/api/health"
          echo "Checking $URL"
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" 2>/dev/null || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Staging is healthy"
              exit 0
            fi
            echo "Attempt $i/20 — status: $STATUS"
            sleep 10
          done
          echo "❌ Health check failed"
          exit 1

      - name: Run migrations on staging
        # Non bloquant : l'entrypoint applique deja migrate deploy + db push au boot.
        # Le token workflow_run peut ne pas avoir le droit de dispatcher (HttpError integration).
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'seed.yml',
              ref: context.ref,
              inputs: { environment: 'staging', action: 'migrate' }
            });
            console.log('Triggered seed.yml (migrate) for staging');

  # ──────────────────────────────────────────────
  # Deploy to production (manual trigger only)
  # ──────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-publish
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - uses: actions/checkout@v5

      # Aucune cible d'infrastructure configurée pour la production (staging
      # seul est câblé, sur Runsite) : échouer tôt et lisiblement plutôt que
      # de laisser croire à un déploiement réussi sans aucun effet.
      - name: Guard — cible de déploiement production non configurée
        run: |
          echo "::error::Aucune méthode de déploiement production n'est configurée dans deploy.yml."
          echo "::error::Ajoutez l'étape correspondant à votre cible (ex. Runsite de production) avant d'utiliser ce workflow."
          exit 1

      - name: Health check
        run: |
          URL="${{ vars.PRODUCTION_URL }}/api/health"
          echo "Checking $URL"
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" 2>/dev/null || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Production is healthy"
              exit 0
            fi
            echo "Attempt $i/20 — status: $STATUS"
            sleep 10
          done
          echo "❌ Health check failed"
          exit 1
